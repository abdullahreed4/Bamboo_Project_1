name: Test Windows App UI

on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: "Build workflow run ID"
        required: true
        type: string

permissions:
  actions: read

jobs:
  test-windows-app:
    name: Install and test Bamboo Project
    runs-on: windows-latest

    steps:
      - name: Download Windows build
        uses: actions/download-artifact@v4
        with:
          name: windows-build
          path: build
          repository: ${{ github.repository }}
          run-id: ${{ inputs.build_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Show downloaded files
        shell: pwsh
        run: |
          Write-Host "Downloaded files:"
          Get-ChildItem -Path build -Recurse |
            Select-Object FullName, Length

      - name: Find NSIS installer
        shell: pwsh
        run: |
          $installer = Get-ChildItem `
            -Path "build" `
            -Filter "*-setup.exe" `
            -Recurse |
            Select-Object -First 1

          if (-not $installer) {
            Write-Error "Could not find the NSIS installer."
            exit 1
          }

          Write-Host "Installer found:"
          Write-Host $installer.FullName

          "INSTALLER=$($installer.FullName)" |
            Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Install Bamboo Project
        shell: pwsh
        run: |
          Write-Host "Installing Bamboo Project..."
          Write-Host "Installer: $env:INSTALLER"

          $process = Start-Process `
            -FilePath "$env:INSTALLER" `
            -ArgumentList "/S" `
            -Wait `
            -PassThru

          Write-Host "Installer exit code: $($process.ExitCode)"

          if ($process.ExitCode -ne 0) {
            Write-Error "Bamboo Project installer failed."
            exit 1
          }

          Write-Host "Installation completed."

      - name: Find installed application
        shell: pwsh
        run: |
          Write-Host "Searching for installed Bamboo Project..."

          $searchPaths = @(
            "$env:LOCALAPPDATA\bamboo-project-1",
            "$env:LOCALAPPDATA\bamboo-project",
            "$env:ProgramFiles\bamboo-project-1",
            "$env:ProgramFiles\bamboo-project"
          )

          $app = $null

          foreach ($path in $searchPaths) {
            if (Test-Path $path) {
              Write-Host "Searching: $path"

              $app = Get-ChildItem `
                -Path $path `
                -Filter "tauri-app.exe" `
                -Recurse `
                -ErrorAction SilentlyContinue |
                Select-Object -First 1

              if ($app) {
                break
              }
            }
          }

          if (-not $app) {
            Write-Host "Application was not found in the expected locations."
            Write-Host "Searching entire user profile..."

            $app = Get-ChildItem `
              -Path "$env:USERPROFILE\AppData\Local" `
              -Filter "tauri-app.exe" `
              -Recurse `
              -ErrorAction SilentlyContinue |
              Select-Object -First 1
          }

          if (-not $app) {
            Write-Error "Could not find installed tauri-app.exe."
            exit 1
          }

          Write-Host "Installed application found:"
          Write-Host $app.FullName

          "APP_EXE=$($app.FullName)" |
            Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Launch Bamboo Project
        shell: pwsh
        run: |
          Write-Host "Launching Bamboo Project..."

          $process = Start-Process `
            -FilePath "$env:APP_EXE" `
            -PassThru

          Write-Host "Application PID: $($process.Id)"

          "APP_PID=$($process.Id)" |
            Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Wait for application
        shell: pwsh
        run: |
          Write-Host "Waiting for Bamboo Project to initialize..."
          Start-Sleep -Seconds 15

          $process = Get-Process `
            -Id $env:APP_PID `
            -ErrorAction SilentlyContinue

          if (-not $process) {
            Write-Error "Bamboo Project exited during startup."
            exit 1
          }

          Write-Host "Bamboo Project is still running."
          Write-Host "Process: $($process.ProcessName)"
          Write-Host "PID: $($process.Id)"
          Write-Host "Window title: $($process.MainWindowTitle)"

      - name: Inspect application window
        shell: pwsh
        run: |
          Add-Type @"
          using System;
          using System.Text;
          using System.Runtime.InteropServices;

          public class WindowInspector
          {
              public delegate bool EnumWindowsProc(
                  IntPtr hWnd,
                  IntPtr lParam);

              [DllImport("user32.dll")]
              public static extern bool EnumWindows(
                  EnumWindowsProc lpEnumFunc,
                  IntPtr lParam);

              [DllImport("user32.dll")]
              public static extern uint GetWindowThreadProcessId(
                  IntPtr hWnd,
                  out uint processId);

              [DllImport("user32.dll")]
              public static extern int GetWindowText(
                  IntPtr hWnd,
                  StringBuilder text,
                  int count);

              [DllImport("user32.dll")]
              public static extern bool IsWindowVisible(
                  IntPtr hWnd);

              public static void Inspect(int targetPid)
              {
                  EnumWindows(delegate(
                      IntPtr hWnd,
                      IntPtr lParam)
                  {
                      uint processId;

                      GetWindowThreadProcessId(
                          hWnd,
                          out processId);

                      if (processId == targetPid &&
                          IsWindowVisible(hWnd))
                      {
                          StringBuilder title =
                              new StringBuilder(512);

                          GetWindowText(
                              hWnd,
                              title,
                              title.Capacity);

                          Console.WriteLine(
                              "WINDOW FOUND | PID=" +
                              processId +
                              " | TITLE=" +
                              title.ToString());
                      }

                      return true;

                  }, IntPtr.Zero);
              }
          }
          "@

          Write-Host "Inspecting Bamboo Project windows..."

          [WindowInspector]::Inspect(
              [int]$env:APP_PID
          )

      - name: Capture desktop screenshot
        uses: OrbitalOwen/desktop-screenshot-action@0.1
        with:
          file-name: bamboo-project-desktop.jpg

      - name: Save application process information
        if: always()
        shell: pwsh
        run: |
          Get-Process `
            -Id $env:APP_PID `
            -ErrorAction SilentlyContinue |
            Format-List * |
            Out-File bamboo-project-process.txt

          Get-Process |
            Where-Object {
              $_.ProcessName -match "bamboo|tauri|msedge|webview"
            } |
            Format-Table `
              Name,
              Id,
              MainWindowTitle,
              Responding |
            Out-File bamboo-project-processes.txt

      - name: Upload UI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bamboo-project-ui-evidence
          path: |
            bamboo-project-desktop.jpg
            bamboo-project-process.txt
            bamboo-project-processes.txt
          if-no-files-found: warn
          retention-days: 7
