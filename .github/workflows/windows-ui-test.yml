name: Test Windows App UI

on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: "GitHub Actions run ID containing the windows-build artifact"
        required: true
        type: string

permissions:
  actions: read

jobs:
  test-windows-app:
    name: Launch and inspect Bamboo Project
    runs-on: windows-latest

    steps:
      - name: Download Windows build
        uses: actions/download-artifact@v5
        with:
          name: windows-build
          path: build
          repository: ${{ github.repository }}
          run-id: ${{ inputs.build_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Show downloaded files
        shell: pwsh
        run: |
          Write-Host "Downloaded build files:"
          Get-ChildItem -Path build -Recurse | Select-Object FullName, Length

      - name: Find application executable
        shell: pwsh
        run: |
          $exe = Get-ChildItem `
            -Path "build" `
            -Filter "*.exe" `
            -Recurse |
            Where-Object {
              $_.Name -notlike "*setup*" -and
              $_.Name -notlike "*uninstall*"
            } |
            Select-Object -First 1

          if (-not $exe) {
            Write-Error "Could not find the Bamboo Project application executable."
            exit 1
          }

          Write-Host "Application executable found:"
          Write-Host $exe.FullName

          "APP_EXE=$($exe.FullName)" >> $env:GITHUB_ENV

      - name: Launch Bamboo Project
        shell: pwsh
        run: |
          Write-Host "Launching Bamboo Project..."

          $process = Start-Process `
            -FilePath "$env:APP_EXE" `
            -PassThru

          Write-Host "Application PID: $($process.Id)"

          "APP_PID=$($process.Id)" >> $env:GITHUB_ENV

      - name: Wait for application
        shell: pwsh
        run: |
          Write-Host "Waiting for Bamboo Project to initialize..."
          Start-Sleep -Seconds 15

          $process = Get-Process `
            -Id $env:APP_PID `
            -ErrorAction SilentlyContinue

          if (-not $process) {
            Write-Error "Bamboo Project exited during startup."
            exit 1
          }

          Write-Host "Bamboo Project is still running."
          Write-Host "Process name: $($process.ProcessName)"
          Write-Host "PID: $($process.Id)"
          Write-Host "Main window title: $($process.MainWindowTitle)"

      - name: Inspect application windows
        shell: pwsh
        run: |
          Add-Type @"
          using System;
          using System.Text;
          using System.Runtime.InteropServices;

          public class WindowInspector
          {
              public delegate bool EnumWindowsProc(IntPtr hWnd, IntPtr lParam);

              [DllImport("user32.dll")]
              public static extern bool EnumWindows(
                  EnumWindowsProc lpEnumFunc,
                  IntPtr lParam);

              [DllImport("user32.dll")]
              public static extern uint GetWindowThreadProcessId(
                  IntPtr hWnd,
                  out uint processId);

              [DllImport("user32.dll")]
              public static extern int GetWindowText(
                  IntPtr hWnd,
                  StringBuilder text,
                  int count);

              [DllImport("user32.dll")]
              public static extern bool IsWindowVisible(
                  IntPtr hWnd);

              public static void Inspect(int targetPid)
              {
                  EnumWindows(delegate(IntPtr hWnd, IntPtr lParam)
                  {
                      uint processId;
                      GetWindowThreadProcessId(hWnd, out processId);

                      if (processId == targetPid && IsWindowVisible(hWnd))
                      {
                          StringBuilder title = new StringBuilder(512);
                          GetWindowText(hWnd, title, title.Capacity);

                          Console.WriteLine(
                              "WINDOW FOUND | PID=" +
                              processId +
                              " | TITLE=" +
                              title.ToString());
                      }

                      return true;
                  }, IntPtr.Zero);
              }
          }
          "@

          Write-Host "Inspecting Windows windows belonging to Bamboo Project..."
          [WindowInspector]::Inspect([int]$env:APP_PID)

      - name: Capture desktop screenshot
        uses: OrbitalOwen/desktop-screenshot-action@0.1
        with:
          file-name: bamboo-project-desktop.jpg

      - name: Save application process information
        if: always()
        shell: pwsh
        run: |
          Write-Host "Saving process information..."

          Get-Process `
            -Id $env:APP_PID `
            -ErrorAction SilentlyContinue |
            Format-List * |
            Out-File bamboo-project-process.txt

          Write-Host "Saving relevant running processes..."

          Get-Process |
            Where-Object {
              $_.ProcessName -match "bamboo|tauri|msedge|webview"
            } |
            Format-Table Name, Id, MainWindowTitle, Responding |
            Out-File bamboo-project-processes.txt

      - name: Upload UI evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bamboo-project-ui-evidence
          path: |
            bamboo-project-desktop.jpg
            bamboo-project-process.txt
            bamboo-project-processes.txt
          if-no-files-found: warn
          retention-days: 7
