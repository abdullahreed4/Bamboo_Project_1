name: Test Windows App UI

on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: "Build workflow run ID"
        required: true
        type: string

permissions:
  actions: read

jobs:
  test-windows-app:
    name: Install and test Bamboo Project
    runs-on: windows-latest

    steps:
      - name: Download Windows build
        uses: actions/download-artifact@v4
        with:
          name: windows-build
          path: build
          repository: ${{ github.repository }}
          run-id: ${{ inputs.build_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Show downloaded files
        shell: pwsh
        run: |
          Write-Host "Downloaded files:"
          Get-ChildItem -Path build -Recurse |
            Select-Object FullName, Length

      - name: Find NSIS installer
        shell: pwsh
        run: |
          $installer = Get-ChildItem `
            -Path "build" `
            -Filter "*-setup.exe" `
            -Recurse |
            Select-Object -First 1

          if (-not $installer) {
            Write-Error "Could not find the NSIS installer."
            exit 1
          }

          Write-Host "Installer found:"
          Write-Host $installer.FullName

          "INSTALLER=$($installer.FullName)" |
            Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Install Bamboo Project
        shell: pwsh
        run: |
          Write-Host "Installing Bamboo Project..."
          Write-Host "Installer: $env:INSTALLER"

          $process = Start-Process `
            -FilePath "$env:INSTALLER" `
            -ArgumentList "/S" `
            -Wait `
            -PassThru

          Write-Host "Installer exit code: $($process.ExitCode)"

          if ($process.ExitCode -ne 0) {
            Write-Error "Bamboo Project installer failed."
            exit 1
          }

          Write-Host "Installation completed."

      - name: Find installed application
        shell: pwsh
        run: |
          Write-Host "Searching for installed Bamboo Project..."

          $searchPaths = @(
            "$env:LOCALAPPDATA\bamboo-project-1",
            "$env:LOCALAPPDATA\bamboo-project",
            "$env:ProgramFiles\bamboo-project-1",
            "$env:ProgramFiles\bamboo-project"
          )

          $app = $null

          foreach ($path in $searchPaths) {
            if (Test-Path $path) {
              Write-Host "Searching: $path"

              $app = Get-ChildItem `
                -Path $path `
                -Filter "tauri-app.exe" `
                -Recurse `
                -ErrorAction SilentlyContinue |
                Select-Object -First 1

              if ($app) {
                break
              }
            }
          }

          if (-not $app) {
            Write-Host "Application was not found in expected locations."
            Write-Host "Searching entire Local AppData..."

            $app = Get-ChildItem `
              -Path "$env:LOCALAPPDATA" `
              -Filter "tauri-app.exe" `
              -Recurse `
              -ErrorAction SilentlyContinue |
              Select-Object -First 1
          }

          if (-not $app) {
            Write-Error "Could not find installed tauri-app.exe."
            exit 1
          }

          Write-Host "Installed application found:"
          Write-Host $app.FullName

          "APP_EXE=$($app.FullName)" |
            Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Launch Bamboo Project
        shell: pwsh
        run: |
          Write-Host "Launching Bamboo Project..."

          $process = Start-Process `
            -FilePath "$env:APP_EXE" `
            -PassThru

          Write-Host "Application PID: $($process.Id)"

          "APP_PID=$($process.Id)" |
            Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Wait for application
        shell: pwsh
        run: |
          Write-Host "Waiting for Bamboo Project to initialize..."
          Start-Sleep -Seconds 15

          $process = Get-Process `
            -Id $env:APP_PID `
            -ErrorAction SilentlyContinue

          if (-not $process) {
            Write-Error "Bamboo Project exited during startup."
            exit 1
          }

          Write-Host "Bamboo Project is still running."
          Write-Host "Process: $($process.ProcessName)"
          Write-Host "PID: $($process.Id)"
          Write-Host "Window title: $($process.MainWindowTitle)"

      - name: Find application window
        shell: pwsh
        run: |
          Add-Type @"
          using System;
          using System.Text;
          using System.Runtime.InteropServices;

          public class WindowInspector
          {
              public delegate bool EnumWindowsProc(
                  IntPtr hWnd,
                  IntPtr lParam);

              [DllImport("user32.dll")]
              public static extern bool EnumWindows(
                  EnumWindowsProc lpEnumFunc,
                  IntPtr lParam);

              [DllImport("user32.dll")]
              public static extern uint GetWindowThreadProcessId(
                  IntPtr hWnd,
                  out uint processId);

              [DllImport("user32.dll")]
              public static extern int GetWindowText(
                  IntPtr hWnd,
                  StringBuilder text,
                  int count);

              [DllImport("user32.dll")]
              public static extern bool IsWindowVisible(
                  IntPtr hWnd);

              public static IntPtr FindWindowForProcess(int targetPid)
              {
                  IntPtr result = IntPtr.Zero;

                  EnumWindows(delegate(
                      IntPtr hWnd,
                      IntPtr lParam)
                  {
                      uint processId;

                      GetWindowThreadProcessId(
                          hWnd,
                          out processId);

                      if (processId == targetPid &&
                          IsWindowVisible(hWnd))
                      {
                          result = hWnd;
                          return false;
                      }

                      return true;

                  }, IntPtr.Zero);

                  return result;
              }

              public static string GetTitle(IntPtr hWnd)
              {
                  StringBuilder title =
                      new StringBuilder(512);

                  GetWindowText(
                      hWnd,
                      title,
                      title.Capacity);

                  return title.ToString();
              }
          }
          "@

          $windowHandle =
            [WindowInspector]::FindWindowForProcess(
              [int]$env:APP_PID
            )

          if ($windowHandle -eq [IntPtr]::Zero) {
            Write-Error "Could not find a visible Bamboo Project window."
            exit 1
          }

          $handleValue = $windowHandle.ToInt64()
          $title = [WindowInspector]::GetTitle($windowHandle)

          Write-Host "Application window found."
          Write-Host "Handle: $handleValue"
          Write-Host "Title: $title"

          "WINDOW_HANDLE=$handleValue" |
            Out-File -FilePath $env:GITHUB_ENV -Append

          "WINDOW_TITLE=$title" |
            Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Capture application window screenshot
        shell: pwsh
        run: |
          Write-Host "Preparing to capture Bamboo Project window..."

          Add-Type -AssemblyName System.Drawing
          Add-Type -AssemblyName System.Windows.Forms

          Add-Type @"
          using System;
          using System.Runtime.InteropServices;

          public static class WindowActivation
          {
              [DllImport("user32.dll")]
              public static extern bool SetForegroundWindow(IntPtr hWnd);

              [DllImport("user32.dll")]
              public static extern bool ShowWindow(IntPtr hWnd, int nCmdShow);

              [DllImport("user32.dll")]
              public static extern bool IsIconic(IntPtr hWnd);
          }
          "@

          $handle = [IntPtr]::new(
            [Int64]$env:WINDOW_HANDLE
          )

          Write-Host "Window handle: $handle"

          # Restore the window if minimized.
          if ([WindowActivation]::IsIconic($handle)) {
              [WindowActivation]::ShowWindow($handle, 9) | Out-Null
          }

          # Bring Bamboo Project to the foreground.
          [WindowActivation]::SetForegroundWindow($handle) | Out-Null

          Start-Sleep -Seconds 2

          $rect = New-Object System.Drawing.Rectangle

          Add-Type @"
          using System;
          using System.Drawing;
          using System.Runtime.InteropServices;

          public static class WindowGeometry
          {
              [DllImport("user32.dll")]
              public static extern bool GetWindowRect(
                  IntPtr hWnd,
                  out RECT rect);

              [StructLayout(LayoutKind.Sequential)]
              public struct RECT
              {
                  public int Left;
                  public int Top;
                  public int Right;
                  public int Bottom;
              }
          }
          "@

          $nativeRect = New-Object WindowGeometry+RECT

          if (-not [WindowGeometry]::GetWindowRect(
              $handle,
              [ref]$nativeRect
          )) {
              Write-Error "GetWindowRect failed."
              exit 1
          }

          $left   = $nativeRect.Left
          $top    = $nativeRect.Top
          $right  = $nativeRect.Right
          $bottom = $nativeRect.Bottom

          $width  = $right - $left
          $height = $bottom - $top

          Write-Host "Window rectangle:"
          Write-Host "Left   = $left"
          Write-Host "Top    = $top"
          Write-Host "Right  = $right"
          Write-Host "Bottom = $bottom"
          Write-Host "Size   = ${width}x${height}"

          if ($width -le 0 -or $height -le 0) {
              Write-Error "Invalid window dimensions."
              exit 1
          }

          $bitmap = New-Object System.Drawing.Bitmap(
              $width,
              $height,
              [System.Drawing.Imaging.PixelFormat]::Format32bppArgb
          )

          $graphics = [System.Drawing.Graphics]::FromImage($bitmap)

          try {
              Write-Host "Copying pixels from Windows desktop..."

              $graphics.CopyFromScreen(
                  $left,
                  $top,
                  0,
                  0,
                  [System.Drawing.Size]::new($width, $height),
                  [System.Drawing.CopyPixelOperation]::SourceCopy
              )

              $output = Join-Path $PWD "bamboo-project-ui.png"

              $bitmap.Save(
                  $output,
                  [System.Drawing.Imaging.ImageFormat]::Png
              )

              Write-Host "Screenshot created:"
              Get-Item $output |
                Select-Object FullName, Length
          }
          finally {
              $graphics.Dispose()
              $bitmap.Dispose()
          }

          if (-not (Test-Path "bamboo-project-ui.png")) {
              Write-Error "Screenshot file was not created."
              exit 1
          }

          $size = (Get-Item "bamboo-project-ui.png").Length

          if ($size -lt 1000) {
              Write-Error "Screenshot is suspiciously small: $size bytes"
              exit 1
          }

          Write-Host "Screenshot verified: $size bytes"

      - name: Save application process information
        if: always()
        shell: pwsh
        run: |
          Get-Process `
            -Id $env:APP_PID `
            -ErrorAction SilentlyContinue |
            Format-List * |
            Out-File bamboo-project-process.txt

          Get-Process |
            Where-Object {
              $_.ProcessName -match "bamboo|tauri|msedge|webview"
            } |
            Format-Table `
              Name,
              Id,
              MainWindowTitle,
              Responding |
            Out-File bamboo-project-processes.txt

          @"
          Application executable:
          $env:APP_EXE

          Process ID:
          $env:APP_PID

          Window handle:
          $env:WINDOW_HANDLE

          Window title:
          $env:WINDOW_TITLE
          "@ | Out-File bamboo-project-window.txt

      - name: Upload UI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bamboo-project-ui-evidence
          path: |
            bamboo-project-ui.png
            bamboo-project-process.txt
            bamboo-project-processes.txt
            bamboo-project-window.txt
          if-no-files-found: warn
          retention-days: 7
